<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate the Models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--surface:#fff;--ink:#1c1b1a;--muted:#77736d;--line:#ebe7e0;--accent:#4f46e5;--soft:#eeedfc;--star:#f2a516;--danger:#c2410c;--ease:cubic-bezier(.22,1,.36,1)}
@media(prefers-color-scheme:dark){:root{--bg:#141312;--surface:#1d1c1a;--ink:#f3f0ea;--muted:#9b968d;--line:#2c2a27;--accent:#8b85ff;--soft:#25233d}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.serif{font-family:'Instrument Serif',serif;font-weight:400}

/* ambient blobs */
.blob{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;pointer-events:none;background:var(--accent);animation:drift 22s ease-in-out infinite alternate}
.blob.b2{background:#f2a516;opacity:.16;right:-160px;top:40vh;animation-duration:28s}
.blob.b1{left:-180px;top:-200px}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}

nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid transparent;transition:border-color .3s}
nav.s{border-color:var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:italic 24px 'Instrument Serif',serif;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
.nav-r{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;transition:transform .25s var(--ease),border-color .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.user{display:flex;align-items:center;gap:10px;font-size:14px}

.hero{padding:88px 0 40px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--accent);background:var(--soft);padding:6px 14px;border-radius:999px;margin-bottom:28px}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
h1{font:400 clamp(44px,8vw,92px)/.98 'Instrument Serif',serif;letter-spacing:-.02em;max-width:860px;margin:0 auto 24px}
h1 em{color:var(--accent)}
h1 .w{display:inline-block;opacity:0;transform:translateY(.5em);animation:up .9s var(--ease) forwards;animation-delay:calc(var(--i)*.06s + .1s)}
@keyframes up{to{opacity:1;transform:none}}
.hero p{color:var(--muted);max-width:520px;margin:0 auto 32px;font-size:18px}
.stats{display:flex;justify-content:center;gap:56px;margin-top:44px}
.stats b{display:block;font:400 44px 'Instrument Serif',serif;line-height:1.1}
.stats span{color:var(--muted);font-size:13px}

.rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:32px 0 12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--line);border-radius:999px;background:var(--surface);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
select{padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);outline:none;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted);transition:all .25s var(--ease)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:13px;margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding-bottom:96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -22px rgba(0,0,0,.3);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mk{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tag{font-size:12px;background:var(--soft);color:var(--accent);padding:3px 10px;border-radius:999px;white-space:nowrap}
.card h3{font:400 28px/1.1 'Instrument Serif',serif}
.card p{color:var(--muted);font-size:14px;flex:1}
.date{font-size:12px;color:var(--muted)}
.avgrow{display:flex;align-items:center;gap:12px}
.avgrow b{font:400 34px 'Instrument Serif',serif;min-width:44px}
.avgrow small{color:var(--muted);font-size:13px}
.meter{height:4px;background:var(--line);border-radius:4px;overflow:hidden;flex:1}
.meter div{height:100%;width:0;background:var(--accent);border-radius:4px;transition:width 1.1s var(--ease)}
.mine{position:absolute;top:14px;right:14px}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.foot .cta{color:var(--accent);font-weight:500;transition:transform .3s var(--ease)}
.card:hover .cta{transform:translateX(4px)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
.sk{height:250px;border-radius:20px;background:linear-gradient(100deg,var(--line) 30%,var(--surface) 50%,var(--line) 70%);background-size:300% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-100% 0}}

/* stars */
.stars{display:inline-flex}
.star{background:none;border:0;padding:2px;line-height:0;transition:transform .25s var(--ease)}
.star svg{width:26px;height:26px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round;transition:fill .2s,stroke .2s}
.star.on svg{fill:var(--star);stroke:var(--star)}
.star:hover{transform:scale(1.2) rotate(-8deg)}
.star.pop{animation:pop .55s var(--ease)}
@keyframes pop{40%{transform:scale(1.5) rotate(12deg)}}
.sm .star{cursor:default;padding:0}.sm .star svg{width:14px;height:14px}.sm .star:hover{transform:none}

footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:13px;text-align:center}

/* overlay + modal + drawer */
.ov{position:fixed;inset:0;background:rgba(20,19,18,.45);backdrop-filter:blur(6px);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;display:grid;place-items:center;padding:20px}
.ov.open{opacity:1;pointer-events:auto}
.modal{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;width:100%;max-width:400px;padding:32px;transform:translateY(20px) scale(.96);transition:transform .5s var(--ease)}
.ov.open .modal{transform:none}
.modal h2{font:400 34px 'Instrument Serif',serif}
.sub{color:var(--muted);font-size:14px;margin:4px 0 20px}
.x{position:absolute;top:14px;right:18px;background:none;border:0;font-size:26px;color:var(--muted);line-height:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:20px;position:relative}
.tabs button{border:0;background:none;padding:8px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.tabs button.on{color:var(--ink)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .45s var(--ease)}
.tabs.up .pill{transform:translateX(100%)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.nf{max-height:0;overflow:hidden;opacity:0;margin:0;transition:all .45s var(--ease)}
.up .nf{max-height:90px;opacity:1;margin-bottom:12px}
.err{color:var(--danger);font-size:13px;min-height:22px}
.full{width:100%;padding:12px;font-size:15px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.g{display:flex;align-items:center;justify-content:center;gap:10px}
#gbtn{display:flex;justify-content:center;min-height:0}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:60;transform:translateX(102%);transition:transform .6s var(--ease);overflow-y:auto;padding:32px 28px 48px}
.drawer.open{transform:none}
.dscrim{position:fixed;inset:0;background:rgba(20,19,18,.35);z-index:55;opacity:0;pointer-events:none;transition:opacity .4s}
.dscrim.open{opacity:1;pointer-events:auto}
.drawer h2{font:400 40px/1.05 'Instrument Serif',serif;margin:6px 0 10px}
.drawer .x{top:18px;right:22px}
.big{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.big b{font:400 64px/1 'Instrument Serif',serif}
.big span{color:var(--muted)}
.dist{display:grid;gap:6px;margin-bottom:28px}
.dr{display:grid;grid-template-columns:14px 1fr 28px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dr .meter{height:6px}
.yr{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:28px;background:var(--bg)}
.yr h4{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.yr textarea{margin:10px 0;resize:vertical;min-height:70px}
.yr .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.rev{padding:14px 0;border-top:1px solid var(--line);font-size:14px}
.rev .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--muted);font-size:13px}
.rev .h b{color:var(--ink);font-weight:500}
.drawer h5{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}

.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:all .5s var(--ease);z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.stats{gap:28px}.hero{padding-top:56px}.user span{display:none}.drawer{padding:28px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.rv,h1 .w{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<nav id="nav"><div class="wrap">
  <div class="logo"><i></i>Rate the Models</div>
  <div class="nav-r" id="navr"></div>
</div></nav>

<header class="wrap hero">
  <div class="eyebrow rv">September 2026 releases</div>
  <h1 id="h1"></h1>
  <p class="rv" style="--d:.5s">Every major model that shipped this month, rated by people who actually use them.</p>
  <div class="rv" style="--d:.6s"><button class="btn p" id="cta">Start rating</button></div>
  <div class="stats rv" style="--d:.7s">
    <div><b id="s1">0</b><span>models</span></div>
    <div><b id="s2">0</b><span>ratings</span></div>
    <div><b id="s3">0</b><span>raters</span></div>
  </div>
</header>

<main class="wrap" id="models">
  <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search models or makers" aria-label="Search"></label>
    <select id="sort" aria-label="Sort">
      <option value="new">Newest</option><option value="top">Top rated</option><option value="most">Most rated</option><option value="az">A–Z</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>Built with Node · sign in to rate · one rating per model per person</footer>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="dscrim" id="dscrim"></div>
<aside class="drawer" id="drawer" aria-label="Model details"></aside>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const star = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>';
const state = { user: null, models: [], kind: "All", q: "", sort: "new", open: null, cfg: {} };

async function api(path, method = "GET", body) {
  const r = await fetch("/api" + path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong"), { status: r.status });
  return j;
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400); }
function countUp(el, to) {
  const from = +el.textContent || 0, t0 = performance.now();
  (function f(t) { const p = Math.min(1, (t - t0) / 900); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 4))); if (p < 1) requestAnimationFrame(f); })(t0);
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .1 });
const observe = () => document.querySelectorAll(".rv:not(.in)").forEach(el => io.observe(el));
addEventListener("scroll", () => $("#nav").classList.toggle("s", scrollY > 8), { passive: true });
const starsHtml = (n, cls = "") => `<span class="stars ${cls}">${[1,2,3,4,5].map(i => `<span class="star ${i <= Math.round(n) ? "on" : ""}">${star}</span>`).join("")}</span>`;
const fmtDate = d => new Date(d + "T00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

/* headline: word-by-word entrance */
$("#h1").innerHTML = "Which new AI model is <em>actually</em> good?".split(" ").map((w, i) => {
  const t = w.startsWith("<em>") ? `<em>${w.replace(/<\/?em>/g, "")}</em>` : w;
  return `<span class="w" style="--i:${i}">${t}</span>`;
}).join(" ");

/* nav */
function renderNav() {
  const u = state.user;
  $("#navr").innerHTML = u
    ? `<div class="user"><div class="avatar">${esc(u.name[0].toUpperCase())}</div><span>${esc(u.name)}</span></div><button class="btn" id="out">Sign out</button>`
    : `<button class="btn" data-auth="in">Sign in</button><button class="btn p" data-auth="up">Sign up</button>`;
}
$("#navr").addEventListener("click", async e => {
  if (e.target.id === "out") { await api("/logout", "POST"); state.user = null; renderNav(); await load(false); if (state.open) openModel(state.open); toast("Signed out"); }
  if (e.target.dataset.auth) openAuth(e.target.dataset.auth);
});
$("#cta").onclick = () => $("#models").scrollIntoView();

/* list */
function visible() {
  const q = state.q.toLowerCase();
  let l = state.models.filter(m => (state.kind === "All" || m.kind === state.kind) && (!q || (m.name + " " + m.maker + " " + m.kind).toLowerCase().includes(q)));
  const s = { new: (a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name), top: (a, b) => b.avg - a.avg || b.count - a.count, most: (a, b) => b.count - a.count, az: (a, b) => a.name.localeCompare(b.name) }[state.sort];
  return l.sort(s);
}
function renderChips() {
  const kinds = ["All", ...[...new Set(state.models.map(m => m.kind))].sort()];
  $("#chips").innerHTML = kinds.map(k => `<button class="chip ${k === state.kind ? "on" : ""}" data-k="${esc(k)}">${esc(k)}</button>`).join("");
}
function renderGrid(animate) {
  const l = visible();
  $("#count").textContent = `${l.length} model${l.length === 1 ? "" : "s"}`;
  $("#grid").innerHTML = l.length ? l.map((m, i) => `
    <button class="card ${animate ? "rv" : ""}" style="--d:${Math.min(i, 9) * .05}s" data-id="${m.id}">
      <div class="top"><span class="mk">${esc(m.maker)}</span><span class="tag">${esc(m.kind)}</span></div>
      <h3>${esc(m.name)}</h3><p>${esc(m.blurb)}</p>
      <div class="avgrow"><b>${m.count ? m.avg.toFixed(1) : "–"}</b><div style="flex:1"><div class="meter"><div data-w="${m.avg / 5 * 100}"></div></div><small>${m.count ? `${m.count} rating${m.count > 1 ? "s" : ""}` : "No ratings yet"}</small></div></div>
      <div class="foot"><span>Released ${fmtDate(m.date)}</span><span class="cta">${m.mine ? `You: ${m.mine.stars}★` : "Rate →"}</span></div>
    </button>`).join("") : `<div class="empty">No models match your search.</div>`;
  observe();
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".meter div[data-w]").forEach(d => d.style.width = d.dataset.w + "%")));
}
async function load(animate = true) {
  const d = await api("/models");
  state.models = d.models;
  renderChips(); renderGrid(animate);
  countUp($("#s1"), d.totals.models); countUp($("#s2"), d.totals.ratings); countUp($("#s3"), d.totals.raters);
}
$("#q").addEventListener("input", e => { state.q = e.target.value; renderGrid(false); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; renderGrid(false); });
$("#chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; state.kind = c.dataset.k; renderChips(); renderGrid(false); });
$("#grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openModel(c.dataset.id); });

/* drawer */
const drawer = $("#drawer"), scrim = $("#dscrim");
function closeDrawer() { drawer.classList.remove("open"); scrim.classList.remove("open"); state.open = null; }
scrim.onclick = closeDrawer;
drawer.addEventListener("click", e => e.target.classList.contains("x") && closeDrawer());
async function openModel(id) {
  state.open = id;
  const m = state.models.find(x => x.id === id); if (!m) return;
  const mine = m.mine, max = Math.max(1, ...m.dist);
  drawer.innerHTML = `<button class="x" aria-label="Close">×</button>
    <span class="mk">${esc(m.maker)} · ${esc(m.kind)} · ${fmtDate(m.date)}</span><h2>${esc(m.name)}</h2>
    <p class="sub" style="margin-bottom:0">${esc(m.blurb)}</p>
    <div class="big"><b>${m.count ? m.avg.toFixed(1) : "–"}</b><span>${m.count ? `from ${m.count} rating${m.count > 1 ? "s" : ""}` : "No ratings yet"}</span></div>
    <div class="dist">${[5,4,3,2,1].map(n => `<div class="dr"><span>${n}</span><div class="meter"><div data-w="${m.dist[n-1] / max * 100}"></div></div><span>${m.dist[n-1]}</span></div>`).join("")}</div>
    <div class="yr"><h4>${state.user ? (mine ? "Your rating" : "Rate this model") : "Sign in to rate this model"}</h4>
      <div class="stars" id="ys">${[1,2,3,4,5].map(n => `<button class="star ${mine && n <= mine.stars ? "on" : ""}" data-n="${n}" aria-label="${n} star${n > 1 ? "s" : ""}">${star}</button>`).join("")}</div>
      <textarea id="rt" maxlength="500" placeholder="Optional: what did you think?">${mine ? esc(mine.review) : ""}</textarea>
      <div class="row"><button class="btn p" id="sv">${state.user ? (mine ? "Update" : "Submit") : "Sign in"}</button>${mine ? `<button class="btn" id="rm">Remove</button>` : ""}</div></div>
    <h5>Reviews</h5><div id="rvs"><div class="sub">Loading…</div></div>`;
  drawer.classList.add("open"); scrim.classList.add("open");
  requestAnimationFrame(() => requestAnimationFrame(() => drawer.querySelectorAll(".meter div[data-w]").forEach(d => d.style.width = d.dataset.w + "%")));
  drawer.dataset.stars = mine ? mine.stars : 0;
  try {
    const { reviews } = await api(`/models/${id}/reviews`);
    $("#rvs").innerHTML = reviews.length ? reviews.map(r => `<div class="rev"><div class="h"><b>${esc(r.name)}</b>${starsHtml(r.stars, "sm")}</div>${esc(r.review)}</div>`).join("") : `<div class="sub">No written reviews yet.</div>`;
  } catch {}
}
function paint(n) { drawer.querySelectorAll("#ys .star").forEach(s => s.classList.toggle("on", +s.dataset.n <= n)); }
drawer.addEventListener("mouseover", e => { const b = e.target.closest("#ys .star"); if (b) paint(+b.dataset.n); });
drawer.addEventListener("mouseout", e => { if (e.target.closest("#ys")) paint(+drawer.dataset.stars); });
drawer.addEventListener("click", async e => {
  const b = e.target.closest("#ys .star");
  if (b) { drawer.dataset.stars = b.dataset.n; paint(+b.dataset.n); b.classList.add("pop"); return; }
  const id = state.open;
  if (e.target.id === "sv") {
    if (!state.user) return openAuth("in", "Sign in to rate");
    const stars = +drawer.dataset.stars; if (!stars) return toast("Pick a star rating first");
    e.target.disabled = true;
    try { const { model } = await api(`/models/${id}/rating`, "PUT", { stars, review: $("#rt").value }); apply(model); toast("Thanks for rating!"); }
    catch (er) { toast(er.message); e.target.disabled = false; }
  }
  if (e.target.id === "rm") { const { model } = await api(`/models/${id}/rating`, "DELETE"); apply(model); toast("Rating removed"); }
});
function apply(model) {
  state.models = state.models.map(m => m.id === model.id ? model : m);
  renderGrid(false); openModel(model.id); load(false);
}

/* auth modal */
const ov = $("#ov"), modal = $("#modal");
function showModal(html) { modal.innerHTML = `<button class="x" aria-label="Close">×</button>` + html; ov.classList.add("open"); setTimeout(() => modal.querySelector("input")?.focus(), 300); }
const closeModal = () => ov.classList.remove("open");
ov.addEventListener("click", e => { if (e.target === ov || e.target.classList.contains("x")) closeModal(); });
addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeDrawer(); } });

function openAuth(mode = "in", sub) {
  const up = mode === "up";
  showModal(`<h2 id="ttl"></h2><p class="sub">${esc(sub || "Rate models and see how others voted.")}</p>
  <div class="tabs" id="tabs"><span class="pill"></span><button data-m="in">Sign in</button><button data-m="up">Sign up</button></div>
  <form id="af" novalidate>
    <label class="field nf"><span>Name</span><input name="name" autocomplete="name"></label>
    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email"></label>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password"></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn p full" id="sb"></button>
  </form>
  <div class="or">or</div>
  <div id="gbtn"></div>
  <button class="btn full g" id="gb"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.7 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.4 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>`);
  setMode(up);
  if (state.cfg.googleClientId && window.google?.accounts) {
    google.accounts.id.initialize({ client_id: state.cfg.googleClientId, callback: r => finish(api("/google", "POST", { credential: r.credential })) });
    google.accounts.id.renderButton($("#gbtn"), { theme: "outline", size: "large", shape: "pill", width: 336 });
    $("#gb").style.display = "none";
  }
}
function setMode(up) {
  $("#tabs").classList.toggle("up", up); modal.classList.toggle("up", up);
  $("#tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", (b.dataset.m === "up") === up));
  $("#ttl").textContent = up ? "Create account" : "Welcome back";
  $("#sb").textContent = up ? "Create account" : "Sign in";
  modal.querySelector("[name=password]").autocomplete = up ? "new-password" : "current-password";
  $("#err").textContent = "";
}
async function finish(p) {
  try { const { user } = await p; state.user = user; closeModal(); renderNav(); toast(`Welcome, ${user.name.split(" ")[0]}`); await load(false); if (state.open) openModel(state.open); }
  catch (er) { const e = $("#err"); if (e) e.textContent = er.message; }
}
modal.addEventListener("click", e => {
  const t = e.target.closest("[data-m]"); if (t) setMode(t.dataset.m === "up");
  if (e.target.closest("#gb")) finish(api("/google", "POST", {}));
});
modal.addEventListener("submit", e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), up = modal.classList.contains("up");
  finish(up ? api("/signup", "POST", f) : api("/login", "POST", f));
});

/* init */
(async () => {
  $("#grid").innerHTML = Array.from({ length: 6 }, () => `<div class="sk"></div>`).join("");
  try {
    const [me, cfg] = await Promise.all([api("/me"), api("/config")]);
    state.user = me.user; state.cfg = cfg;
    if (cfg.googleClientId) { const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; document.head.appendChild(s); }
  } catch {}
  renderNav(); observe();
  try { await load(true); } catch { $("#grid").innerHTML = `<div class="empty">Couldn't reach the server. Start it with <code>node server.js</code>.</div>`; }
})();
</script>
</body>
</html>
