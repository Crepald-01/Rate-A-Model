<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate the Models</title>
<meta name="description" content="Rate every major AI model released in September 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--surface:#fff;--ink:#1c1b1a;--muted:#77736d;--line:#ebe7e0;--accent:#4f46e5;--soft:#eeedfc;--star:#f2a516;--danger:#c2410c;--shadow:rgba(40,30,20,.28);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121110;--surface:#1b1a18;--ink:#f3f0ea;--muted:#9b968d;--line:#2b2926;--accent:#8b85ff;--soft:#25233d;--shadow:rgba(0,0,0,.6)}}
:root[data-theme=dark]{--bg:#121110;--surface:#1b1a18;--ink:#f3f0ea;--muted:#9b968d;--line:#2b2926;--accent:#8b85ff;--soft:#25233d;--shadow:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
kbd{font:500 11px Inter,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--surface)}

/* theme reveal (View Transitions) */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){clip-path:circle(0 at var(--tx,50%) var(--ty,0));animation:reveal .7s var(--ease) forwards}
@keyframes reveal{to{clip-path:circle(150vmax at var(--tx,50%) var(--ty,0))}}

/* ambient */
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.mesh i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.32;animation:drift 24s ease-in-out infinite alternate}
.mesh i:nth-child(1){width:560px;height:560px;background:var(--accent);left:-160px;top:-180px}
.mesh i:nth-child(2){width:460px;height:460px;background:#f2a516;opacity:.16;right:-140px;top:30vh;animation-duration:30s}
.mesh i:nth-child(3){width:380px;height:380px;background:#ec4899;opacity:.12;left:30vw;bottom:-200px;animation-duration:36s}
@keyframes drift{to{transform:translate(110px,80px) scale(1.2)}}
.progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:70}

nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px) saturate(1.4);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid transparent;transition:border-color .3s}
nav.s{border-color:var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:italic 25px 'Instrument Serif',serif;display:flex;align-items:center;gap:9px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:ping 2.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
.nav-r{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;transition:transform .3s var(--ease),border-color .2s,background .2s,opacity .2s;position:relative}
.btn:hover{transform:translateY(-1px);border-color:var(--muted)}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:50%}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .6s var(--spring)}
.icon:hover svg{transform:rotate(25deg)}
.sun{display:none}
:root[data-theme=dark] .sun{display:block}:root[data-theme=dark] .moon{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .sun{display:block}:root:not([data-theme=light]) .moon{display:none}}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ec4899);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.user{display:flex;align-items:center;gap:10px;font-size:14px;margin-right:4px}

/* hero */
.hero{padding:84px 0 28px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--accent);background:var(--soft);padding:6px 14px;border-radius:999px;margin-bottom:28px}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.25}}
h1{font:400 clamp(46px,8.4vw,98px)/.96 'Instrument Serif',serif;letter-spacing:-.025em;max-width:900px;margin:0 auto 24px}
h1 em{color:var(--accent)}
h1 .w{display:inline-block;opacity:0;transform:translateY(.6em) rotate(3deg);filter:blur(8px);animation:wordin 1s var(--ease) forwards;animation-delay:calc(var(--i)*.07s + .1s)}
@keyframes wordin{to{opacity:1;transform:none;filter:none}}
.lead{color:var(--muted);max-width:520px;margin:0 auto 30px;font-size:18px}
.rv{opacity:0;transform:translateY(22px);animation:up .9s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes up{to{opacity:1;transform:none}}
.stats{display:flex;justify-content:center;gap:12px;margin:44px auto 0;flex-wrap:wrap}
.stat{background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line);border-radius:18px;padding:14px 26px;min-width:130px;backdrop-filter:blur(8px)}
.stat b{display:block;font:400 42px/1.1 'Instrument Serif',serif;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.topnow{margin-top:18px;font-size:14px;color:var(--muted);min-height:22px}
.topnow b{color:var(--ink);font-weight:500}

/* marquee */
.marquee{overflow:hidden;margin:36px 0 8px;mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;gap:44px;width:max-content;animation:scroll 42s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{font:italic 26px 'Instrument Serif',serif;color:var(--muted);white-space:nowrap;opacity:.7;transition:color .3s,opacity .3s}
.track span:hover{color:var(--accent);opacity:1}
@keyframes scroll{to{transform:translateX(-50%)}}

/* controls */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:34px 0 14px}
.search{flex:1;min-width:230px;position:relative}
.search input{width:100%;padding:12px 44px 12px 44px;border:1px solid var(--line);border-radius:999px;background:var(--surface);outline:none;transition:border-color .2s,box-shadow .3s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);transition:opacity .2s}
.search input:focus~kbd,.search input:not(:placeholder-shown)~kbd{opacity:0}
select{padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);outline:none;cursor:pointer}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;position:relative}
.seg button{border:0;background:none;padding:8px 14px;font-size:13px;font-weight:500;color:var(--muted);border-radius:999px;position:relative;z-index:1;transition:color .3s;white-space:nowrap}
.seg button.on{color:var(--bg)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));background:var(--ink);border-radius:999px;transform:translateX(calc(var(--i)*100%));transition:transform .55s var(--spring)}
.seg.view button{padding:8px 11px;display:grid;place-items:center}
.seg.view svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted);transition:all .3s var(--ease)}
.chip:hover{color:var(--ink);transform:translateY(-1px)}
.chip.on{background:var(--soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.count{color:var(--muted);font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;padding-bottom:96px;perspective:1200px}
.grid.list{grid-template-columns:1fr;gap:10px}
.card{--mx:50%;--my:50%;--rx:0deg;--ry:0deg;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;overflow:hidden;
  transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s;will-change:transform}
.card:hover{box-shadow:0 26px 50px -26px var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card .glow{position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx) var(--my),color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover .glow{opacity:1}
.card>*{position:relative}
.card>.glow{position:absolute}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mk{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;display:flex;gap:8px;align-items:center}
.rank{background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 8px;font-size:11px;letter-spacing:0;font-weight:600}
.tag{font-size:12px;background:var(--soft);color:var(--accent);padding:3px 10px;border-radius:999px;white-space:nowrap}
.card h3{font:400 30px/1.08 'Instrument Serif',serif;letter-spacing:-.01em}
.card p{color:var(--muted);font-size:14px;flex:1}
.avgrow{display:flex;align-items:center;gap:14px}
.avgrow b{font:400 36px 'Instrument Serif',serif;min-width:46px;font-variant-numeric:tabular-nums}
.avgrow small{color:var(--muted);font-size:13px}
.meter{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ec4899);border-radius:5px;transition:width 1.2s var(--ease)}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.foot .cta{color:var(--accent);font-weight:500;transition:transform .35s var(--ease)}
.card:hover .cta{transform:translateX(4px)}
.save{background:none;border:0;padding:6px;margin:-6px -6px -6px 0;line-height:0;border-radius:50%;color:var(--muted);transition:transform .35s var(--spring),color .2s}
.save svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.save:hover{transform:scale(1.2);color:var(--ink)}
.save.on{color:var(--accent)}.save.on svg{fill:currentColor}
.save.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.5) rotate(-10deg)}}
.grid.list .card{flex-direction:row;align-items:center;gap:22px;padding:16px 22px}
.grid.list .card p,.grid.list .card .foot{display:none}
.grid.list .card .top{flex-direction:column;align-items:flex-start;gap:4px;width:170px;flex:none}
.grid.list .card h3{flex:1;font-size:26px}
.grid.list .card .avgrow{width:230px;flex:none}
.grid.list .card .save{order:9}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0}
.empty b{display:block;font:400 32px 'Instrument Serif',serif;color:var(--ink);margin-bottom:6px}
.sk{height:262px;border-radius:22px;background:linear-gradient(100deg,var(--line) 30%,var(--surface) 50%,var(--line) 70%);background-size:300% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-100% 0}}

/* stars */
.stars{display:inline-flex}
.star{background:none;border:0;padding:2px;line-height:0;transition:transform .3s var(--spring)}
.star svg{width:30px;height:30px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round;transition:fill .25s,stroke .25s}
.star.on svg{fill:var(--star);stroke:var(--star)}
.star:hover{transform:scale(1.25) rotate(-8deg)}
.star.pop{animation:pop .6s var(--spring)}
@keyframes pop{40%{transform:scale(1.55) rotate(14deg)}}
.sm .star{cursor:default;padding:0}.sm .star svg{width:14px;height:14px}.sm .star:hover{transform:none}
.pt{position:fixed;width:9px;height:9px;background:var(--star);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);pointer-events:none;z-index:120}

footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:13px;text-align:center}
footer a{color:inherit}

/* overlay + modal + drawer */
.ov{position:fixed;inset:0;background:rgba(20,19,18,.45);backdrop-filter:blur(8px);z-index:80;opacity:0;pointer-events:none;transition:opacity .35s;display:grid;place-items:center;padding:20px}
.ov.open{opacity:1;pointer-events:auto}
.modal{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:26px;width:100%;max-width:420px;padding:34px;transform:translateY(28px) scale(.95);transition:transform .6s var(--spring)}
.ov.open .modal{transform:none}
.modal h2{font:400 36px 'Instrument Serif',serif}
.sub{color:var(--muted);font-size:14px;margin:4px 0 20px}
.x{position:absolute;top:14px;right:18px;background:none;border:0;font-size:26px;color:var(--muted);line-height:1;transition:transform .4s var(--spring)}
.x:hover{transform:rotate(90deg);color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:20px;position:relative}
.tabs button{border:0;background:none;padding:8px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.tabs button.on{color:var(--ink)}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .55s var(--spring)}
.tabs.up .pill{transform:translateX(100%)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.nf{max-height:0;overflow:hidden;opacity:0;margin:0;transition:all .5s var(--ease)}
.up .nf{max-height:90px;opacity:1;margin-bottom:12px}
.err{color:var(--danger);font-size:13px;min-height:22px}
.full{width:100%;padding:12px;font-size:15px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.g{display:flex;align-items:center;justify-content:center;gap:10px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;font-size:14px;color:var(--muted)}
.keys dt{display:flex;gap:4px}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:60;transform:translateX(104%);transition:transform .7s var(--ease);overflow-y:auto;padding:30px 28px 56px}
.drawer.open{transform:none}
.dscrim{position:fixed;inset:0;background:rgba(20,19,18,.35);backdrop-filter:blur(3px);z-index:55;opacity:0;pointer-events:none;transition:opacity .5s}
.dscrim.open{opacity:1;pointer-events:auto}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dh .acts{display:flex;gap:6px}
.drawer h2{font:400 44px/1.02 'Instrument Serif',serif;letter-spacing:-.015em;margin:4px 0 10px}
.big{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.big b{font:400 68px/1 'Instrument Serif',serif}
.big span{color:var(--muted)}
.dist{display:grid;gap:7px;margin-bottom:28px}
.dr{display:grid;grid-template-columns:14px 1fr 28px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dr .meter{height:7px}
.yr{border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:28px;background:var(--bg)}
.yr h4{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.yr textarea{margin:10px 0;resize:vertical;min-height:72px}
.yr .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.yr .hint{font-size:12px;color:var(--muted)}
.rev{padding:14px 0;border-top:1px solid var(--line);font-size:14px}
.rev .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--muted);font-size:13px}
.rev .h b{color:var(--ink);font-weight:500}
.drawer h5{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,30px) scale(.95);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:all .6s var(--spring);z-index:130;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.grid.list .card{flex-wrap:wrap}.grid.list .card .top,.grid.list .card .avgrow{width:auto}.grid.list .card h3{flex:1 1 60%}.seg{width:100%}.seg button{padding:8px 6px}}
@media(max-width:600px){.hero{padding-top:56px}.user span{display:none}.drawer{padding:26px 20px}.stat{min-width:100px;padding:12px 18px}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}.rv,h1 .w{opacity:1;transform:none;filter:none}.track{animation:none}}
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div class="mesh"><i></i><i></i><i></i></div>

<nav id="nav"><div class="wrap">
  <div class="logo"><i></i>Rate the Models</div>
  <div class="nav-r" id="navr"></div>
</div></nav>

<header class="wrap hero">
  <div class="eyebrow rv">September 2026 releases</div>
  <h1 id="h1"></h1>
  <p class="lead rv" style="--d:.55s">Every major model that shipped this month, rated by people who actually use them.</p>
  <div class="rv" style="--d:.65s"><button class="btn p" id="cta">Start rating</button></div>
  <div class="stats rv" style="--d:.75s">
    <div class="stat"><b id="s1">0</b><span>models</span></div>
    <div class="stat"><b id="s2">0</b><span>ratings</span></div>
    <div class="stat"><b id="s3">0</b><span>raters</span></div>
  </div>
  <div class="topnow rv" style="--d:.85s" id="topnow"></div>
  <div class="marquee rv" style="--d:.95s" aria-hidden="true"><div class="track" id="track"></div></div>
</header>

<main class="wrap" id="models">
  <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search models or makers" aria-label="Search" autocomplete="off"><kbd>/</kbd></label>
    <select id="sort" aria-label="Sort">
      <option value="new">Newest</option><option value="top">Top rated</option><option value="most">Most rated</option><option value="az">A–Z</option>
    </select>
    <div class="seg view" id="view" style="--n:2;--i:0" aria-label="Layout"><span class="pill"></span>
      <button data-v="grid" aria-label="Grid view"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
      <button data-v="list" aria-label="List view"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
  <div class="tools" style="margin-top:0">
    <div class="seg" id="scope" style="--n:4;--i:0" role="tablist"><span class="pill"></span>
      <button data-s="all">All</button><button data-s="saved">Saved</button><button data-s="mine">My ratings</button><button data-s="unrated">Not rated</button>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
const EASE = "cubic-bezier(.22,1,.36,1)";
const star = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>';
const bookmark = '<svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>';

/* ---------- prefs (localStorage, always guarded) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const state = {
  user: null, models: [], cfg: {}, open: null,
  kind: "All", q: "", sort: store.get("rtm_sort", "new"), scope: "all", view: store.get("rtm_view", "grid"),
  saved: new Set(store.get("rtm_saved", []))
};

/* ---------- backend: Supabase. api() keeps a tiny REST-like surface. ---------- */
const CFG = window.RTM_CONFIG || {};
const sb = CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase ? supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const toUser = u => u && { id: u.id, email: u.email, name: u.user_metadata?.name || u.user_metadata?.full_name || (u.email || "User").split("@")[0] };
const fail = e => { throw new Error(e?.message || "Something went wrong"); };
async function myUser() { const { data } = await sb.auth.getSession(); return toUser(data.session?.user); }
async function summaries() {
  const [stats, totals, me] = await Promise.all([sb.from("model_stats").select("*"), sb.from("site_totals").select("*").maybeSingle(), myUser()]);
  if (stats.error) fail(stats.error);
  const mine = {};
  if (me) { const r = await sb.from("ratings").select("model_id,stars,review").eq("user_id", me.id); (r.data || []).forEach(x => mine[x.model_id] = x); }
  const byId = Object.fromEntries(stats.data.map(s => [s.model_id, s]));
  return { list: window.MODEL_LIST, byId, mine, totals: totals.data || { ratings: 0, raters: 0 } };
}
const shape = (m, s, mine) => ({ ...m, count: s?.n || 0, avg: s?.avg || 0, dist: s ? [s.d1, s.d2, s.d3, s.d4, s.d5] : [0, 0, 0, 0, 0], mine: mine || null });
async function api(path, method = "GET", body) {
  if (!sb) throw new Error("Backend not configured. Add your Supabase URL and key in config.js.");
  let m;
  if (path === "/config") return { googleClientId: "" };
  if (path === "/me") return { user: await myUser() };
  if (path === "/models") {
    const { list, byId, mine, totals } = await summaries();
    return { models: list.map(x => shape(x, byId[x.id], mine[x.id])), totals: { models: list.length, ratings: totals.ratings, raters: totals.raters } };
  }
  if ((m = path.match(/^\/models\/([\w-]+)\/reviews$/))) {
    const { data, error } = await sb.from("ratings").select("user_name,stars,review,updated_at").eq("model_id", m[1]).neq("review", "").order("updated_at", { ascending: false }).limit(50);
    if (error) fail(error);
    return { reviews: data.map(r => ({ name: r.user_name, stars: r.stars, review: r.review })) };
  }
  if ((m = path.match(/^\/models\/([\w-]+)\/rating$/))) {
    const me = await myUser(); if (!me) throw new Error("Sign in to rate.");
    if (method === "DELETE") { const { error } = await sb.from("ratings").delete().eq("model_id", m[1]).eq("user_id", me.id); if (error) fail(error); }
    else {
      const { error } = await sb.from("ratings").upsert({ model_id: m[1], user_id: me.id, user_name: me.name, stars: body.stars, review: (body.review || "").trim().slice(0, 500), updated_at: new Date().toISOString() });
      if (error) fail(error);
    }
    const { list, byId, mine } = await summaries(), x = list.find(y => y.id === m[1]);
    return { model: shape(x, byId[x.id], mine[x.id]) };
  }
  if (path === "/signup") {
    const name = (body.name || "").trim();
    if (!name) throw new Error("Please enter your name.");
    const { data, error } = await sb.auth.signUp({ email: body.email, password: body.password, options: { data: { name } } });
    if (error) fail(error);
    if (!data.session) throw new Error("Check your email to confirm your account, then sign in.");
    return { user: toUser(data.user) };
  }
  if (path === "/login") {
    const { data, error } = await sb.auth.signInWithPassword({ email: body.email, password: body.password });
    if (error) fail(error);
    return { user: toUser(data.user) };
  }
  if (path === "/google") {
    const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
    if (error) fail(error);
    return new Promise(() => {}); // browser is redirecting to Google
  }
  if (path === "/logout") { await sb.auth.signOut(); return {}; }
  throw new Error("Not found");
}

/* ---------- helpers ---------- */
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400); }

  clearTimeout(el._t); el._t = setTimeout(() => el.textContent = to, 1100); // fallback if rAF is paused
  (function f(t) { const p = Math.min(1, (t - t0) / 900); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 4))); if (p < 1) requestAnimationFrame(f); })(t0);
}
const starsHtml = (n, cls = "") => `<span class="stars ${cls}">${[1,2,3,4,5].map(i => `<span class="star ${i <= Math.round(n) ? "on" : ""}">${star}</span>`).join("")}</span>`;
const fmtDate = d => new Date(d + "T00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
function burst(x, y) {
  if (reduced) return;
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("i"); p.className = "pt"; p.style.left = x + "px"; p.style.top = y + "px"; document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 80, s = .6 + Math.random() * .9;
    p.animate([{ transform: `translate(-50%,-50%) scale(${s})`, opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d + 20}px)) scale(0) rotate(180deg)`, opacity: 0 }], { duration: 650 + Math.random() * 450, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => p.remove();
  }
}

/* ---------- FEATURE 1: theme toggle with circular reveal ---------- */
const themeNow = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

{ const t = store.get("rtm_theme", null); if (t) document.documentElement.dataset.theme = t; }

/* ---------- nav ---------- */

/* ---------- FEATURE 3: shareable links / persistent state in the URL hash ---------- */
function syncHash() {
  if (location.hash.includes("access_token") || location.hash.includes("error")) return; // don't clobber OAuth return
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.sort !== "new") p.set("sort", state.sort);
  if (state.kind !== "All") p.set("kind", state.kind);
  if (state.scope !== "all") p.set("scope", state.scope);

}

  const p = new URLSearchParams(location.hash.slice(1));

  if (p.get("kind")) state.kind = p.get("kind");

/* ---------- list rendering + FLIP motion ---------- */
function visible() {
  const q = state.q.toLowerCase();
  const l = state.models.filter(m =>
    (state.kind === "All" || m.kind === state.kind) &&
    (!q || (m.name + " " + m.maker + " " + m.kind).toLowerCase().includes(q)) &&
    (state.scope === "all" || (state.scope === "saved" && state.saved.has(m.id)) || (state.scope === "mine" && m.mine) || (state.scope === "unrated" && !m.mine)));
  const s = { new: (a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name), top: (a, b) => b.avg - a.avg || b.count - a.count, most: (a, b) => b.count - a.count, az: (a, b) => a.name.localeCompare(b.name) }[state.sort];
  return l.sort(s);
}
function renderChips() {
  const kinds = ["All", ...[...new Set(state.models.map(m => m.kind))].sort()];
  $("#chips").innerHTML = kinds.map(k => `<button class="chip ${k === state.kind ? "on" : ""}" data-k="${esc(k)}">${esc(k)}</button>`).join("");
}

  </article>`;
}
const EMPTY = {
  saved: ["Nothing saved yet", "Tap the bookmark on any model to keep it here."],

function renderGrid() {

  $("#count").textContent = `${l.length} model${l.length === 1 ? "" : "s"}`;

    const f = first.get(c.dataset.id), r = c.getBoundingClientRect();

    else c.animate([{ opacity: 0, transform: "translateY(22px) scale(.96)" }, { opacity: 1, transform: "none" }], { duration: 650, delay: Math.min(i, 14) * 40, easing: EASE, fill: "backwards" });
  });
  requestAnimationFrame(() => requestAnimationFrame(() => g.querySelectorAll(".meter div[data-w]").forEach(d => d.style.width = d.dataset.w + "%")));
}
function renderHero(totals) {
  countUp($("#s1"), totals.models); countUp($("#s2"), totals.ratings); countUp($("#s3"), totals.raters);
  const top = [...state.models].filter(m => m.count).sort((a, b) => b.avg - a.avg || b.count - a.count)[0];

  const makers = [...new Set(state.models.map(m => m.maker))];

async function load() {

/* controls */
function moveSeg(el, i) { el.style.setProperty("--i", i); }
function setScope(s) {

  state.scope = s; syncControls(); renderGrid(); syncHash();
}

/* ---------- FEATURE 2: saved models ---------- */
function toggleSave(id, btn) {

}

/* ---------- drawer ---------- */

function closeDrawer() { drawer.classList.remove("open"); scrim.classList.remove("open"); state.open = null; syncHash(); }
scrim.onclick = closeDrawer;

      <button class="btn icon" id="share" aria-label="Copy link"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.700l1-1"/></svg></button>

    <div class="yr"><h4>${state.user ? (mine ? "Your rating" : "Rate this model") : "Sign in to rate this model"}</h4>
      <div class="stars" id="ys">${[1,2,3,4,5].map(n => `<button class="star ${mine && n <= mine.stars ? "on" : ""}" data-n="${n}" aria-label="${n} star${n > 1 ? "s" : ""}">${star}</button>`).join("")}</div>
      <textarea id="rt" maxlength="500" placeholder="Optional: what did you think?">${mine ? esc(mine.review) : ""}</textarea>
      <div class="row"><span class="hint">Tip: press <kbd>1</kbd>–<kbd>5</kbd></span><span style="display:flex;gap:8px">${mine ? `<button class="btn" id="rm">Remove</button>` : ""}<button class="btn p" id="sv">${state.user ? (mine ? "Update" : "Submit") : "Sign in"}</button></span></div></div>

  } catch {}
}
function paint(n) { drawer.querySelectorAll("#ys .star").forEach(s => s.classList.toggle("on", +s.dataset.n <= n)); }
function pick(n, el) { drawer.dataset.stars = n; paint(n); const b = drawer.querySelector(`#ys .star[data-n="${n}"]`); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); }
drawer.addEventListener("mouseover", e => { const b = e.target.closest("#ys .star"); if (b) paint(+b.dataset.n); });
drawer.addEventListener("mouseout", e => { if (e.target.closest("#ys")) paint(+drawer.dataset.stars); });
drawer.addEventListener("click", async e => {
  const id = state.open;
  if (e.target.closest("#dclose")) return closeDrawer();
  if (e.target.closest("#dsave")) return toggleSave(id);
  if (e.target.closest("#share")) {
    const url = location.origin + location.pathname + "#m=" + id;
    try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch { prompt("Copy this link", url); }
    return;
  }
  const b = e.target.closest("#ys .star"); if (b) return pick(+b.dataset.n);
  if (e.target.closest("#sv")) {
    if (!state.user) return openAuth("in", "Sign in to rate");
    const stars = +drawer.dataset.stars; if (!stars) return toast("Pick a star rating first");
    const btn = e.target.closest("#sv"); btn.disabled = true;
    try { const { model } = await api(`/models/${id}/rating`, "PUT", { stars, review: $("#rt").value }); const r = btn.getBoundingClientRect(); burst(r.left + r.width / 2, r.top); apply(model); toast("Thanks for rating!"); }
    catch (er) { toast(er.message); btn.disabled = false; }
  }
  if (e.target.closest("#rm")) { const { model } = await api(`/models/${id}/rating`, "DELETE"); apply(model); toast("Rating removed"); }
});
async function apply(model) {
  state.models = state.models.map(m => m.id === model.id ? model : m);
  renderGrid(); openModel(model.id);
  try { const d = await api("/models"); state.models = d.models; renderGrid(); renderHero(d.totals); } catch {}
}

/* ---------- modals ---------- */
const ov = $("#ov"), modal = $("#modal");
function showModal(html) { modal.innerHTML = `<button class="x" aria-label="Close">×</button>` + html; ov.classList.add("open"); setTimeout(() => modal.querySelector("input")?.focus(), 350); }
const closeModal = () => ov.classList.remove("open");
ov.addEventListener("click", e => { if (e.target === ov || e.target.classList.contains("x")) closeModal(); });

/* ---------- FEATURE 4: keyboard shortcuts ---------- */
function openHelp() {
  showModal(`<h2>Shortcuts</h2><p class="sub">Get around without touching the mouse.</p>
  <dl class="keys">
    <dt><kbd>/</kbd></dt><dd>Search</dd>
    <dt><kbd>j</kbd><kbd>k</kbd></dt><dd>Next / previous model</dd>
    <dt><kbd>Enter</kbd></dt><dd>Open the focused model</dd>
    <dt><kbd>s</kbd></dt><dd>Save / unsave focused model</dd>
    <dt><kbd>1</kbd>–<kbd>5</kbd></dt><dd>Set stars while a model is open</dd>
    <dt><kbd>g</kbd></dt><dd>Toggle grid / list</dd>
    <dt><kbd>t</kbd></dt><dd>Toggle light / dark</dd>
    <dt><kbd>Esc</kbd></dt><dd>Close anything</dd>
  </dl>`);
}
addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); closeDrawer(); document.activeElement?.blur?.(); return; }
  const t = e.target, typing = t.matches?.("input,textarea,select") || t.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "/") { e.preventDefault(); $("#q").focus(); }
  else if (k === "?") { e.preventDefault(); openHelp(); }
  else if (k === "t") setTheme(themeNow() === "dark" ? "light" : "dark");
  else if (k === "g") { state.view = state.view === "grid" ? "list" : "grid"; store.set("rtm_view", state.view); syncControls(); renderGrid(); }
  else if (state.open && /^[1-5]$/.test(k)) pick(+k);
  else if (k === "j" || k === "k") {
    const cards = [...document.querySelectorAll(".card")]; if (!cards.length) return;
    const i = cards.indexOf(document.activeElement), n = k === "j" ? Math.min(cards.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
    cards[i < 0 ? 0 : n].focus();
  }
  else if (k === "s" && document.activeElement?.classList.contains("card")) toggleSave(document.activeElement.dataset.id);
});

/* ---------- auth ---------- */
function openAuth(mode = "in", sub) {
  const up = mode === "up";
  showModal(`<h2 id="ttl"></h2><p class="sub">${esc(sub || "Rate models and see how others voted.")}</p>
  <div class="tabs" id="tabs"><span class="pill"></span><button data-m="in">Sign in</button><button data-m="up">Sign up</button></div>
  <form id="af" novalidate>
    <label class="field nf"><span>Name</span><input name="name" autocomplete="name"></label>
    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email"></label>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password"></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn p full" id="sb"></button>
  </form>
  <div class="or">or</div>
  <button class="btn full g" id="gb"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.7 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.4 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>`);
  setMode(up);
}
function setMode(up) {
  $("#tabs").classList.toggle("up", up); modal.classList.toggle("up", up);
  $("#tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", (b.dataset.m === "up") === up));
  $("#ttl").textContent = up ? "Create account" : "Welcome back";
  $("#sb").textContent = up ? "Create account" : "Sign in";
  modal.querySelector("[name=password]").autocomplete = up ? "new-password" : "current-password";
  $("#err").textContent = "";
}
async function finish(p) {
  try { const { user } = await p; state.user = user; closeModal(); renderNav(); toast(`Welcome, ${user.name.split(" ")[0]}`); await load(); if (state.open) openModel(state.open); }
  catch (er) { const e = $("#err"); if (e) e.textContent = er.message; }
}
modal.addEventListener("click", e => {
  const t = e.target.closest("[data-m]"); if (t) setMode(t.dataset.m === "up");
  if (e.target.closest("#gb")) finish(api("/google", "POST", {}));
});
modal.addEventListener("submit", e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), up = modal.classList.contains("up");
  finish(up ? api("/signup", "POST", f) : api("/login", "POST", f));
});

/* ---------- init ---------- */
(async () => {
  const deep = readHash();
  syncControls();
  $("#grid").innerHTML = Array.from({ length: 6 }, () => `<div class="sk"></div>`).join("");
  try {
    const me = await api("/me"); state.user = me.user;
  } catch {}
  renderNav();
  try { window.MODEL_LIST = await (await fetch("models.json")).json(); } catch { window.MODEL_LIST = []; }
  try {
    await load();
    if (state.user === null && (state.scope === "mine" || state.scope === "unrated")) { state.scope = "all"; syncControls(); renderGrid(); }
    if (deep) openModel(deep);
  } catch (er) {
    if (!sb && window.MODEL_LIST.length) { state.models = window.MODEL_LIST.map(m => shape(m)); renderChips(); renderGrid(); renderHero({ models: state.models.length, ratings: 0, raters: 0 }); toast("Backend not configured yet, see README"); }
    else $("#grid").innerHTML = `<div class="empty"><b>Couldn't load</b>${esc(er.message)}</div>`;
  }
})();
</script>
</body>
